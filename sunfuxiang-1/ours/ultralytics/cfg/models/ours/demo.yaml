# Ultralytics YOLO 🚀, GPL-3.0 license
# YOLOv8 object detection model with P3-P5 outputs.
# Using EnergyGatedOCSPDConv instead of original space_to_depth.

nc: 4

scales:
  # [depth, width, max_channels]
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 1]]                           # 0-P1/2
  - [-1, 1, Conv, [128, 3, 1]]                          # 1-P2/4
  - [-1, 1, EnergyGatedOCSPDConv, [1.0, 2.0, 16]]       # 2
  - [-1, 3, C2f, [128, True]]                           # 3
  - [-1, 1, CPCA1, []]                                  # 4

  - [-1, 1, Conv, [256, 3, 1]]                          # 5-P3/8
  - [-1, 1, EnergyGatedOCSPDConv, [1.0, 2.0, 16]]       # 6
  - [-1, 6, C2f, [256, True]]                           # 7: P3 特征

  - [-1, 1, Conv, [512, 3, 1]]                          # 8-P4/16
  - [-1, 1, EnergyGatedOCSPDConv, [1.0, 2.0, 16]]       # 9
  - [-1, 6, C2f, [512, True]]                           # 10: P4 特征

  - [-1, 1, Conv, [1024, 3, 1]]                         # 11-P5/32
  - [-1, 1, EnergyGatedOCSPDConv, [1.0, 2.0, 16]]       # 12
  - [-1, 3, C2f, [1024, True]]                          # 13
  - [-1, 1, AIFI, [1024, 8]]                            # 14: P5 特征

head:
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]          # 15
  - [[-1, 10], 1, Concat, [1]]                          # 16: 融合处理后的 P4
  - [-1, 4, C2f, [512]]                                 # 17

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]          # 18
  - [[-1, 7], 1, Concat, [1]]                           # 19: 融合处理后的 P3
  - [-1, 4, C2f, [256]]                                 # 20: P3/8-small

  - [-1, 1, Conv, [256, 3, 1]]                          # 21
  - [-1, 1, EnergyGatedOCSPDConv, [1.0, 2.0, 16]]       # 22
  - [[-1, 17], 1, Concat, [1]]                          # 23: 融合 head P4
  - [-1, 4, C2f, [512]]                                 # 24: P4/16-medium

  - [-1, 1, Conv, [512, 3, 1]]                          # 25
  - [-1, 1, EnergyGatedOCSPDConv, [1.0, 2.0, 16]]       # 26
  - [[-1, 14], 1, Concat, [1]]                          # 27: 融合 P5
  - [-1, 4, C2f, [1024]]                                # 28: P5/32-large

  - [[20, 24, 28], 1, Detect, [nc]]                     # 29: Detect(P3, P4, P5)