# ============================================================
# L1-B: Backbone-P4 Compression Only
# Purpose:
#   Compress ONLY backbone P4 channels:
#   128 -> 64
#
# Keep neck/head identical to standard YOLOv8n.
#
# Effective channels under n scale (width=0.25):
# Backbone:
#   P3 = 64
#   P4 = 64      <- compressed
#   P5 = 256
#
# Detect:
#   P3 = 64
#   P4 = 128
#   P5 = 256
# ============================================================

nc: 3

scales:
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]

backbone:
  # [from, repeats, module, args]

  # Stem
  - [-1, 1, Conv, [64, 3, 2]]          # 0-P1/2, 16 ch
  - [-1, 1, Conv, [128, 3, 2]]         # 1-P2/4, 32 ch
  - [-1, 3, C2f, [128, True]]          # 2

  # P3
  - [-1, 1, Conv, [256, 3, 2]]         # 3-P3/8, 64 ch
  - [-1, 6, C2f, [256, True]]          # 4-P3, 64 ch

  # P4: compressed 128 -> 64
  - [-1, 1, Conv, [256, 3, 2]]         # 5-P4/16, 64 ch
  - [-1, 6, C2f, [256, True]]          # 6-P4, 64 ch

  # P5: unchanged
  - [-1, 1, Conv, [1024, 3, 2]]        # 7-P5/32, 256 ch
  - [-1, 3, C2f, [1024, True]]         # 8-P5, 256 ch
  - [-1, 1, SPPF, [1024, 5]]           # 9

head:
  # Top-down P5 -> P4
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 10
  - [[-1, 6], 1, Concat, [1]]                   # 11
  - [-1, 3, C2f, [512]]                         # 12, restore P4=128

  # Top-down P4 -> P3
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 13
  - [[-1, 4], 1, Concat, [1]]                   # 14
  - [-1, 3, C2f, [256]]                         # 15-P3/8, 64

  # Bottom-up P3 -> P4
  - [-1, 1, Conv, [256, 3, 2]]                  # 16
  - [[-1, 12], 1, Concat, [1]]                  # 17
  - [-1, 3, C2f, [512]]                         # 18-P4/16, 128

  # Bottom-up P4 -> P5
  - [-1, 1, Conv, [512, 3, 2]]                  # 19
  - [[-1, 9], 1, Concat, [1]]                   # 20
  - [-1, 3, C2f, [1024]]                        # 21-P5/32, 256

  - [[15, 18, 21], 1, Detect, [nc]]             # 22