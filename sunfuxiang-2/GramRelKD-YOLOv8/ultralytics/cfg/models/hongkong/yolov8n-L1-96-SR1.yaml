# Ultralytics YOLOv8
# ============================================================
# L1-96-SR1-P4Only
#
# Purpose:
#   Determine whether the accuracy loss of SR1 mainly came
#   from compressing the P5 C2f hidden channels at Layer 21.
#
# External feature channels remain identical to L1-96:
#   Detect P3 = 64
#   Detect P4 = 96
#   Detect P5 = 256
#
# Hidden-channel configuration:
#   Layer 12: 48  -> 40
#   Layer 18: 48  -> 40
#   Layer 21: 128 -> 128  (restored)
#
# No custom module or parse_model modification is required.
# ============================================================

# Parameters
nc: 3

scales:
  # [depth, width, max_channels]
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]

# ============================================================
# Backbone
# Identical to L1-96
# ============================================================
backbone:
  # [from, repeats, module, args]

  # Stem
  - [-1, 1, Conv, [64, 3, 2]]          # 0-P1/2, effective 16 channels
  - [-1, 1, Conv, [128, 3, 2]]         # 1-P2/4, effective 32 channels
  - [-1, 3, C2f, [128, True]]          # 2, effective output 32

  # P3
  - [-1, 1, Conv, [256, 3, 2]]         # 3-P3/8, effective 64
  - [-1, 6, C2f, [256, True]]          # 4-P3, effective output 64

  # P4 = 96
  - [-1, 1, Conv, [384, 3, 2]]         # 5-P4/16, effective 96
  - [-1, 6, C2f, [384, True]]          # 6-P4, effective output 96

  # P5 = 256
  - [-1, 1, Conv, [1024, 3, 2]]        # 7-P5/32, effective 256
  - [-1, 3, C2f, [1024, True]]         # 8-P5, effective output 256
  - [-1, 1, SPPF, [1024, 5]]           # 9, effective output 256

# ============================================================
# Detection Head
# ============================================================
head:
  # ----------------------------------------------------------
  # Top-down: P5 -> P4
  # ----------------------------------------------------------
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 10
  - [[-1, 6], 1, Concat, [1]]                   # 11

  # Layer 12:
  # effective output c2 = 384 × 0.25 = 96
  # original hidden = int(96 × 0.5) = 48
  # compressed hidden = int(96 × 0.4166667) = 40
  - [-1, 3, C2f, [384, False, 1, 0.4166667]]    # 12-P4, output 96

  # ----------------------------------------------------------
  # Top-down: P4 -> P3
  # ----------------------------------------------------------
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 13
  - [[-1, 4], 1, Concat, [1]]                   # 14

  # Preserve P3 C2f completely
  # effective output = 256 × 0.25 = 64
  # hidden remains 64 × 0.5 = 32
  - [-1, 3, C2f, [256]]                         # 15-P3/8, output 64

  # ----------------------------------------------------------
  # Bottom-up: P3 -> P4
  # ----------------------------------------------------------
  - [-1, 1, Conv, [256, 3, 2]]                  # 16, output 64
  - [[-1, 12], 1, Concat, [1]]                  # 17

  # Layer 18:
  # effective output c2 = 384 × 0.25 = 96
  # original hidden = 48
  # compressed hidden = 40
  - [-1, 3, C2f, [384, False, 1, 0.4166667]]    # 18-P4/16, output 96

  # ----------------------------------------------------------
  # Bottom-up: P4 -> P5
  # ----------------------------------------------------------
  - [-1, 1, Conv, [512, 3, 2]]                  # 19, output 128
  - [[-1, 9], 1, Concat, [1]]                   # 20

  # Layer 21 restored to standard L1-96 configuration:
  # effective output c2 = 1024 × 0.25 = 256
  # hidden = int(256 × 0.5) = 128
  - [-1, 3, C2f, [1024, False, 1, 0.5]]         # 21-P5/32, output 256

  # Detect:
  # P3 = 64
  # P4 = 96
  # P5 = 256
  - [[15, 18, 21], 1, Detect, [nc]]             # 22