# ============================================================
# L1-N: Neck-P4 Compression Only
#
# Backbone remains standard YOLOv8n.
#
# Backbone:
#   P3 = 64
#   P4 = 128
#   P5 = 256
#
# Neck:
#   P4 = 64      <- compressed
#
# Detect:
#   P3 = 64
#   P4 = 64
#   P5 = 256
# ============================================================

nc: 3

scales:
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]          # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]         # 1-P2/4
  - [-1, 3, C2f, [128, True]]          # 2

  - [-1, 1, Conv, [256, 3, 2]]         # 3-P3/8
  - [-1, 6, C2f, [256, True]]          # 4-P3 = 64

  # Standard P4
  - [-1, 1, Conv, [512, 3, 2]]         # 5-P4/16 = 128
  - [-1, 6, C2f, [512, True]]          # 6-P4 = 128

  # Standard P5
  - [-1, 1, Conv, [1024, 3, 2]]        # 7-P5/32 = 256
  - [-1, 3, C2f, [1024, True]]         # 8
  - [-1, 1, SPPF, [1024, 5]]           # 9

head:
  # Top-down P4 compressed to 64
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 10
  - [[-1, 6], 1, Concat, [1]]                   # 11
  - [-1, 3, C2f, [256]]                         # 12-P4 = 64

  # P3 remains 64
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 13
  - [[-1, 4], 1, Concat, [1]]                   # 14
  - [-1, 3, C2f, [256]]                         # 15-P3 = 64

  # Bottom-up P4 compressed to 64
  - [-1, 1, Conv, [256, 3, 2]]                  # 16
  - [[-1, 12], 1, Concat, [1]]                  # 17
  - [-1, 3, C2f, [256]]                         # 18-P4 = 64

  # P5 remains standard
  - [-1, 1, Conv, [512, 3, 2]]                  # 19
  - [[-1, 9], 1, Concat, [1]]                   # 20
  - [-1, 3, C2f, [1024]]                        # 21-P5 = 256

  - [[15, 18, 21], 1, Detect, [nc]]             # 22