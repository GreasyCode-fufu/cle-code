# ============================================================
# YOLOv8n-L1-96 + C2f_SPP at Layer 18
#
# Baseline:
#   L1-96
#
# Modification:
#   Replace only Layer 18 C2f with C2f_SPP
#
# Layer 18:
#   output channels = 96
#   hidden channels = 48
#   active channels = 24
#   bypass channels = 24
#
# Other layers remain identical to L1-96.
# ============================================================

nc: 3

scales:
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]

backbone:
  # Stem
  - [-1, 1, Conv, [64, 3, 2]]          # 0-P1/2, effective 16
  - [-1, 1, Conv, [128, 3, 2]]         # 1-P2/4, effective 32
  - [-1, 3, C2f, [128, True]]          # 2

  # P3 = 64
  - [-1, 1, Conv, [256, 3, 2]]         # 3-P3/8
  - [-1, 6, C2f, [256, True]]          # 4-P3, effective 64

  # P4 = 96
  - [-1, 1, Conv, [384, 3, 2]]         # 5-P4/16
  - [-1, 6, C2f, [384, True]]          # 6-P4, effective 96

  # P5 = 256
  - [-1, 1, Conv, [1024, 3, 2]]        # 7-P5/32
  - [-1, 3, C2f, [1024, True]]         # 8-P5, effective 256
  - [-1, 1, SPPF, [1024, 5]]           # 9

head:
  # Top-down: P5 -> P4
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 10
  - [[-1, 6], 1, Concat, [1]]                   # 11
  - [-1, 3, C2f, [384]]                         # 12-P4, effective 96

  # Top-down: P4 -> P3
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 13
  - [[-1, 4], 1, Concat, [1]]                   # 14
  - [-1, 3, C2f, [256]]                         # 15-P3, effective 64

  # Bottom-up: P3 -> P4
  - [-1, 1, Conv, [256, 3, 2]]                  # 16
  - [[-1, 12], 1, Concat, [1]]                  # 17

  # ----------------------------------------------------------
  # Layer 18: only modified layer
  #
  # c2 in YAML = 384
  # effective c2 = 384 × 0.25 = 96
  # hidden = 96 × 0.5 = 48
  # active = 48 × 0.5 = 24
  # bypass = 48 - 24 = 24
  # ----------------------------------------------------------
  - [-1, 3, C2f_SPP, [384, False, 1, 0.5, 0.5]]  # 18-P4, effective 96

  # Bottom-up: P4 -> P5
  - [-1, 1, Conv, [512, 3, 2]]                  # 19
  - [[-1, 9], 1, Concat, [1]]                   # 20
  - [-1, 3, C2f, [1024]]                        # 21-P5, effective 256

  # Detection
  - [[15, 18, 21], 1, Detect, [nc]]             # 22